[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tortus-rag"
version = "0.1.0"
description = "Toroidal semantic graph retrieval for measurable multi-hop RAG trade-offs."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Darsh Garg" }]
keywords = ["rag", "retrieval", "graphrag", "knowledge-graph", "semantic-search"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
  "beautifulsoup4>=4.12.3",
  "httpx>=0.27.2",
  "numpy>=2.1.0",
  "openai>=1.59.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "pypdf>=5.1.0",
  "python-dotenv>=1.0.1",
  "rich>=13.9.0",
  "scipy>=1.14.0",
  "trafilatura>=1.12.2",
  "typer>=0.15.0"
]

[project.urls]
Homepage = "https://github.com/darshgarg7/Tortus"
Repository = "https://github.com/darshgarg7/Tortus"
Issues = "https://github.com/darshgarg7/Tortus/issues"

[project.optional-dependencies]
dev = [
  "beautifulsoup4>=4.12.3",
  "build>=1.2.2",
  "duckdb>=1.1.3",
  "fastapi>=0.115.0",
  "hypothesis>=6.119.0",
  "jinja2>=3.1.4",
  "llama-index-core>=0.12.0",
  "mypy>=1.13.0",
  "pypdf>=5.1.0",
  "pytest>=8.3.0,<9",
  "pytest-benchmark>=5.1.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.8.0",
  "strawberry-graphql[fastapi]>=0.252.0",
  "trafilatura>=1.12.2",
  "twine>=6.0.0",
  "uvicorn>=0.32.0"
]
api = [
  "fastapi>=0.115.0",
  "jinja2>=3.1.4",
  "strawberry-graphql[fastapi]>=0.252.0",
  "uvicorn>=0.32.0"
]
eval = [
  "duckdb>=1.1.3"
]
ingest = [
  "beautifulsoup4>=4.12.3",
  "pypdf>=5.1.0",
  "trafilatura>=1.12.2"
]
faiss = [
  "faiss-cpu>=1.9.0"
]
baselines = [
  "graphrag>=2.0.0",
  "llama-index-core>=0.12.0",
  "lightrag-hku>=1.0.0"
]
release = [
  "build>=1.2.2",
  "twine>=6.0.0"
]

[project.scripts]
tortus = "tortus.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/tortus"]

[tool.hatch.build.targets.sdist]
include = [
  "src/tortus/**",
  "tests/**",
  "README.md",
  "LICENSE",
  "pyproject.toml",
  ".env.example",
  "assets/**",
  "data/golden_set.json",
  "data/audits/*.jsonl",
  "data/benchmark_snapshots/*.json",
  "data/reports/eval-report.md",
  "docs/**",
  "examples/**",
  "scripts/**"
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["D107", "D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D103"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
packages = ["tortus"]
