<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Tortus demo terminal output</title>
  <desc id="desc">A terminal screenshot showing tortus demo producing a cited diagnosis, evidence path, recommended actions, source health, and citations.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#080a0f"/>
      <stop offset="0.55" stop-color="#101827"/>
      <stop offset="1" stop-color="#071014"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <rect x="70" y="58" width="1060" height="604" rx="18" fill="#0b1020" stroke="#263244" filter="url(#shadow)"/>
  <rect x="70" y="58" width="1060" height="44" rx="18" fill="#111827"/>
  <circle cx="102" cy="80" r="7" fill="#fb7185"/>
  <circle cx="126" cy="80" r="7" fill="#f59e0b"/>
  <circle cx="150" cy="80" r="7" fill="#34d399"/>
  <text x="184" y="86" fill="#94a3b8" font-family="SFMono-Regular, Consolas, monospace" font-size="14">tortus demo --yes</text>

  <text x="98" y="136" fill="#67e8f9" font-family="SFMono-Regular, Consolas, monospace" font-size="18">$ tortus demo --yes</text>

  <rect x="98" y="164" width="1004" height="78" rx="10" fill="#0f172a" stroke="#2dd4bf" stroke-opacity="0.45"/>
  <text x="126" y="194" fill="#e5e7eb" font-family="SFMono-Regular, Consolas, monospace" font-size="16">Tortus Solve</text>
  <text x="126" y="222" fill="#cbd5e1" font-family="SFMono-Regular, Consolas, monospace" font-size="15">Project acme-demo    Corpus acme-payments-demo    Mode demo</text>

  <rect x="98" y="266" width="1004" height="142" rx="10" fill="#101827" stroke="#34d399" stroke-opacity="0.48"/>
  <text x="126" y="298" fill="#ffffff" font-family="SFMono-Regular, Consolas, monospace" font-size="17">Diagnosis</text>
  <text x="126" y="328" fill="#dbeafe" font-family="SFMono-Regular, Consolas, monospace" font-size="15">Primary symptoms were trace continuity breaking only on retry, audience validation</text>
  <text x="126" y="354" fill="#dbeafe" font-family="SFMono-Regular, Consolas, monospace" font-size="15">warnings increasing for EU refund workers, ledger writes succeeding after retry,</text>
  <text x="126" y="380" fill="#dbeafe" font-family="SFMono-Regular, Consolas, monospace" font-size="15">and observability showing two unrelated traces.</text>
  <text x="126" y="398" fill="#94a3b8" font-family="SFMono-Regular, Consolas, monospace" font-size="13">confidence 0.95 | quality local | tortus setup to upgrade</text>

  <rect x="98" y="430" width="482" height="132" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-opacity="0.42"/>
  <text x="126" y="462" fill="#ffffff" font-family="SFMono-Regular, Consolas, monospace" font-size="16">Likely Evidence Path</text>
  <text x="126" y="492" fill="#cbd5e1" font-family="SFMono-Regular, Consolas, monospace" font-size="14">1. primary symptoms</text>
  <text x="126" y="516" fill="#cbd5e1" font-family="SFMono-Regular, Consolas, monospace" font-size="14">2. retry follows audience validation</text>
  <text x="126" y="540" fill="#cbd5e1" font-family="SFMono-Regular, Consolas, monospace" font-size="14">3. [source] auth token migration</text>

  <rect x="620" y="430" width="482" height="132" rx="10" fill="#0f172a" stroke="#67e8f9" stroke-opacity="0.42"/>
  <text x="648" y="462" fill="#ffffff" font-family="SFMono-Regular, Consolas, monospace" font-size="16">Recommended Actions</text>
  <text x="648" y="492" fill="#cbd5e1" font-family="SFMono-Regular, Consolas, monospace" font-size="14">1. Verify token audience and service boundary.</text>
  <text x="648" y="516" fill="#cbd5e1" font-family="SFMono-Regular, Consolas, monospace" font-size="14">2. Re-run trace-context propagation checks.</text>
  <text x="648" y="540" fill="#cbd5e1" font-family="SFMono-Regular, Consolas, monospace" font-size="14">3. Audit retry paths for dropped headers.</text>

  <rect x="98" y="586" width="1004" height="48" rx="10" fill="#0f172a" stroke="#64748b" stroke-opacity="0.4"/>
  <text x="126" y="617" fill="#cbd5e1" font-family="SFMono-Regular, Consolas, monospace" font-size="14">Source Health  docs 4 | chunks 12 | unsupported 0 | quality 1.00    Citations  6 spans</text>
