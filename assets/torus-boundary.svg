<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">Flat semantic space versus toroidal semantic space</title>
  <desc id="desc">A side-by-side diagram showing how a flat grid creates artificial distance at boundaries while a toroidal grid wraps edges so related concepts remain neighbors.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-soft" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; rx: 18; }
      .grid { stroke: #cbd5e1; stroke-width: 1.5; }
      .title { font: 700 28px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .label { font: 500 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .small { font: 500 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .node-a { fill: #f97316; stroke: #9a3412; stroke-width: 3; }
      .node-b { fill: #22c55e; stroke: #166534; stroke-width: 3; }
      .bad { stroke: #ef4444; stroke-width: 4; stroke-dasharray: 8 8; fill: none; }
      .good { stroke: #0f766e; stroke-width: 4; fill: none; marker-end: url(#arrow-soft); }
      .wrap { stroke: #2563eb; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .muted { fill: #e2e8f0; stroke: #94a3b8; stroke-width: 2; }
    </style>
  </defs>

  <rect class="bg" width="1120" height="520"/>

  <rect class="panel" x="40" y="40" width="500" height="430"/>
  <text class="title" x="80" y="92">Flat semantic space</text>
  <text class="label" x="80" y="122">Boundaries make nearby ideas look far apart.</text>

  <g transform="translate(90 160)">
    <rect x="0" y="0" width="360" height="240" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>
    <path class="grid" d="M60 0 V240 M120 0 V240 M180 0 V240 M240 0 V240 M300 0 V240"/>
    <path class="grid" d="M0 60 H360 M0 120 H360 M0 180 H360"/>
    <circle class="node-a" cx="28" cy="120" r="16"/>
    <circle class="node-b" cx="332" cy="120" r="16"/>
    <path class="bad" d="M48 120 C130 55, 230 55, 312 120"/>
    <text class="small" x="78" y="70">long path across partition</text>
    <text class="small" x="-8" y="278">Concept A</text>
    <text class="small" x="282" y="278">Concept B</text>
  </g>

  <rect class="panel" x="580" y="40" width="500" height="430"/>
  <text class="title" x="620" y="92">Toroidal semantic space</text>
  <text class="label" x="620" y="122">Edges wrap, so boundary neighbors stay close.</text>

  <g transform="translate(630 160)">
    <rect x="0" y="0" width="360" height="240" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>
    <path class="grid" d="M60 0 V240 M120 0 V240 M180 0 V240 M240 0 V240 M300 0 V240"/>
    <path class="grid" d="M0 60 H360 M0 120 H360 M0 180 H360"/>
    <circle class="node-a" cx="28" cy="120" r="16"/>
    <circle class="node-b" cx="332" cy="120" r="16"/>
    <path class="good" d="M332 120 C374 120, 374 120, 360 120"/>
    <path class="good" d="M0 120 C-14 120, -14 120, 28 120"/>
    <path class="wrap" d="M180 -18 C230 -48, 280 -48, 330 -18"/>
    <path class="wrap" d="M180 258 C130 288, 80 288, 30 258"/>
    <text class="small" x="104" y="70">wrapped neighborhood</text>
    <text class="small" x="-8" y="278">Concept A</text>
    <text class="small" x="282" y="278">Concept B</text>
  </g>

  <g transform="translate(430 224)">
    <rect class="muted" x="0" y="0" width="260" height="92" rx="14"/>
    <text class="label" x="24" y="36">Same concepts,</text>
    <text class="label" x="24" y="64">different topology.</text>
  </g>
</svg>
