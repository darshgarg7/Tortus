name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - MVP-V2
      - MVP-V4
      - MVP-V5

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy src/tortus scripts/run_pytest.py

      - name: Pytest
        run: python scripts/run_pytest.py

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: twine check dist/*

      - name: Wheel install smoke
        run: |
          python -m venv /tmp/tortus-base-smoke
          /tmp/tortus-base-smoke/bin/python -m pip install --upgrade pip
          WHEEL="./$(ls dist/tortus_rag-*.whl)"
          /tmp/tortus-base-smoke/bin/python -m pip install "$WHEEL"
          /tmp/tortus-base-smoke/bin/python -c "import tortus; print(tortus.__version__)"
          HOME=/tmp/tortus-home /tmp/tortus-base-smoke/bin/tortus --help
          HOME=/tmp/tortus-home /tmp/tortus-base-smoke/bin/tortus demo --project ci-demo --output /tmp/tortus-demo-report.md --yes
          test -s /tmp/tortus-demo-report.md
          grep -q "Tortus Solve Report" /tmp/tortus-demo-report.md
          HOME=/tmp/tortus-home /tmp/tortus-base-smoke/bin/tortus solve --demo "What should Acme fix to stop EU refund trace fragmentation?" --project ci-solve --output /tmp/tortus-solve-report.md --yes
          test -s /tmp/tortus-solve-report.md
          grep -q "Recommended Actions" /tmp/tortus-solve-report.md
          python -m venv /tmp/tortus-api-smoke
          /tmp/tortus-api-smoke/bin/python -m pip install --upgrade pip
          /tmp/tortus-api-smoke/bin/python -m pip install "$WHEEL[api]"
          HOME=/tmp/tortus-home /tmp/tortus-api-smoke/bin/tortus serve --last --dry-run
